sources:
  - id: kernel-fusion-skill
    source_path: skills/KernelFusion/
    license: NONE-DECLARED (inherits the source repository's status)
    files_inspected:
      - skills/KernelFusion/SKILL.md
      - skills/KernelFusion/fusion-patterns.md
      - skills/KernelFusion/reference/01-when-to-fuse.md
      - skills/KernelFusion/reference/02-fusion-taxonomy.md
      - skills/KernelFusion/reference/05-hardware-sm90-h100-h200.md
      - skills/KernelFusion/reference/06-sota-survey.md
    disposition: DISTILLED
    informs: [SKILL.md, references/04-fusion.md, references/03-writing.md]
    what_survived: >
      The fusion decision process — fuse to remove a round trip or a
      synchronisation, not to reduce a kernel count; the bound-class taxonomy and
      which lever each class implies; the roofline argument computed from the
      implementation rather than from the algorithm.
    what_did_not: >
      Every hardware budget, which was written for SM 12.0 and SM 10.0 and does
      not describe sm_90; the repository's scripts and directory conventions; and
      the megakernel subtree, which is quarantined (see `excluded`).

  - id: anti-cheat-and-verification
    source_path: .claude/docs/reference/
    license: NONE-DECLARED (inherits the source repository's status)
    files_inspected:
      - .claude/docs/reference/anti_cheat.md
      - .claude/docs/reference/verify.md
      - .claude/docs/reference/candidate_layout.md
      - .claude/docs/reference/kernels.md
    disposition: DISTILLED
    informs: [references/03-writing.md, references/05-verification.md,
              templates/review-checklist.md]
    what_survived: >
      The dispatch-only rule and the audit that produced it — twenty candidates
      across four operators, each a wrapper reporting a library's speed as its
      own, each having passed every numerical check. The forbidden-symbol
      taxonomy. The distinction between dispatch and plumbing. The ordering of a
      verification battery cheapest-first, and the requirement that a published
      result carry real numbers rather than a placeholder.
    what_did_not: >
      The six-file candidate directory format, the hub publication workflow, the
      per-check profile names, and every repository-specific command. Those
      describe a different system's plumbing.

  - id: workload-targets
    source_path: .claude/docs/reference/workload_targets.md
    license: NONE-DECLARED (inherits the source repository's status)
    files_inspected:
      - .claude/docs/reference/workload_targets.md
    disposition: DISTILLED
    informs: [references/02-signature.md]
    what_survived: >
      The signature as the unit of optimisation; decode and prefill as different
      kernels rather than a geomean; per-batch-size lineages; the argument
      against usage-class labels in place of written-down axes.

  - id: profiler-report-skill
    source_path: skills/ncu-report-skill/
    license: NONE-DECLARED (inherits the source repository's status)
    files_inspected:
      - skills/ncu-report-skill/SKILL.md
      - skills/ncu-report-skill/README.md
    disposition: DISTILLED
    informs: [references/01-is-it-a-kernel.md, references/06-measuring.md]
    what_survived: >
      Which profile fields turn an observation into a hypothesis; occupancy
      limiters; the warning that a profiler perturbs short kernels and that the
      wall clock is the tiebreak.
    what_did_not: >
      The vendor-specific report parsing, and the Blackwell programming reference
      it bundles, which is about a different architecture.

  - id: kernel-wiki-skill
    source_path: skills/KernelWiki/
    license: MIXED (third-party artefacts under assorted licences; none reproduced)
    files_inspected:
