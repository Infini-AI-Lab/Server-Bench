      - skills/KernelWiki/index.md
      - skills/KernelWiki/README.md
    disposition: DISTILLED
    informs: [references/03-writing.md]
    what_survived: >
      The habit of recording where a design idea was learned, so a later reader
      can check the claim rather than take it.
    what_did_not: >
      The artefact store itself — blog snapshots and vendor code excerpts under
