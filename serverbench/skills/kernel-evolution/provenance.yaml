excluded:
  - id: megakernel-skill-tree
    source_path: skills/KernelFusion/megakernel/
    license: MIXED (third-party source under assorted licences; none reproduced)
    files_inspected:
      - "skills/KernelFusion/megakernel/ — directory listing only, 78 files, none read
         into this bundle"
    disposition: EXCLUDED
    reason: >
      Out of scope for this harness. It is a different research
      question, it needs a schedule compiler and a virtual machine before it
      computes anything, and it does not compose with an ordinary composable-kernel
      candidate loop. It also carries a references/ tree of third-party source
      under several licences, none of which is reproduced here.
    enforcement: >
      kernel_evolve.verification.scan scans this skill along with the package, the
      knowledge tree and the built distribution, and fails rather than warns.
