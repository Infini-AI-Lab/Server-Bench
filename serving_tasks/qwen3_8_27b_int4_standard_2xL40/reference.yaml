# Created by serving_tasks/_manage/new_task.py; change it with `taskctl set`.
kind: serving_task_reference
schema: serverbench.task_reference/1
task_id: qwen3_8_27b_int4_standard_2xL40
correctness:
  rule: replay_fidelity_and_held_out_answers_vs_plain_checkpoint
  reference_arm: sglang
  answer_sample_size: 20
  max_absolute_accuracy_drop: 0.2
  max_token_regret: 4.0
  eos_audit: true
arms:
- framework: sglang
  serve_extra: "--context-length 1048576 --json-model-override-args '{\"text_config\":{\"max_position_embeddings\":1048576,\"rope_parameters\":{\"rope_type\":\"yarn\",\"factor\":4.0,\"original_max_position_embeddings\":262144,\"mrope_interleaved\":true,\"mrope_section\":[11,11,10],\"rope_theta\":10000000,\"partial_rotary_factor\":0.25}}}' --mem-fraction-static 0.90 --max-running-requests {concurrency}"
- framework: vllm
  serve_extra: "--max-model-len 1048576 --hf-overrides '{\"text_config\":{\"max_position_embeddings\":1048576,\"rope_parameters\":{\"rope_type\":\"yarn\",\"factor\":4.0,\"original_max_position_embeddings\":262144,\"mrope_interleaved\":true,\"mrope_section\":[11,11,10],\"rope_theta\":10000000,\"partial_rotary_factor\":0.25}}}' --gpu-memory-utilization 0.90 --max-num-seqs {concurrency}"
- framework: tensorrt-llm
  serve_extra: ""
# sglang_settings: generated from arms[sglang].serve_extra by `taskctl render`;
# change the launch line, not this block.
sglang_settings:
  image: lmsysorg/sglang:v0.5.19
  context-length: 1048576
  json-model-override-args: '{"text_config":{"max_position_embeddings":1048576,"rope_parameters":{"rope_type":"yarn","factor":4.0,"original_max_position_embeddings":262144,"mrope_interleaved":true,"mrope_section":[11,11,10],"rope_theta":10000000,"partial_rotary_factor":0.25}}}'
  mem-fraction-static: 0.9
  max-running-requests: '{concurrency}'
# `concurrency_search` is added once SGLang has been measured on this model and
# hardware; its `adopted` point is the module's REFERENCE_CONCURRENCY, which the
# instruction states as a reference (`taskctl set --reference-concurrency N`).
concurrency_search:
  arm: sglang
  image: lmsysorg/sglang:v0.5.19
  window_seconds: 1800
  selection_rule: operator_confirmed_concurrency_4_skip_search
  adopted: 4
  random_seeds: fresh per run
