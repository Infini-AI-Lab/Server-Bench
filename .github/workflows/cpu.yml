name: cpu

# Runs on every push and pull request, including from forks. Everything here is
# CPU-only and needs no credential, no device and no network beyond the package
# index — which is what makes it safe to run untrusted code in.
#
# A self-hosted runner and a credential must never be reachable from a workflow
# that a pull request can trigger; GPU and agent work is run by hand.
#
# Every independent check carries `if: ${{ !cancelled() }}`, so the job runs all
# of them and reports all of them: without it the first failure skips the rest,
# and a type diagnostic would decide whether the test suite runs.
#
# `install` and the two setup steps stay blocking -- nothing can be checked in an
# environment that was not built. `build` carries the guard too, because it is an
# independent check. The two steps that READ `dist/` are the only ones that
# require `build` to have succeeded, so a build failure is one red step and not
# three.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: cpu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: serverbench
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install
        run: pip install -e '.[dev]'

      - name: lint
        if: ${{ !cancelled() }}
        run: ruff check harness/serverbench tests

      - name: types (scoped to the harness core)
        if: ${{ !cancelled() }}
        run: |
          pip install ty
          ty check harness/serving_evolve

      - name: tests
        if: ${{ !cancelled() }}
        # Checks that need a deployed host carry the `host` marker, which
        # pyproject.toml deselects by default.
        run: pytest tests -q

      - name: importing the harness must not load a framework
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY'
          import sys
          import threading
          before = threading.active_count()
          import serving_evolve  # noqa: F401
          heavy = sorted({"torch", "transformers", "vllm", "sglang", "tensorrt_llm"}
                         & set(sys.modules))
          assert not heavy, f"importing the harness pulled in {heavy}"
          # Importing the harness starts no threads.
          after = threading.active_count()
          assert after == before, (
              f"importing the harness started {after - before} thread(s): "
              f"{[t.name for t in threading.enumerate()]}")
          print("import is side-effect free")
          PY

      - name: build
        id: build
        if: ${{ !cancelled() }}
        run: pip install build && python -m build

      - name: the distribution must carry no evidence, model or absolute path
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python - <<'PY'
          import glob, tarfile, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          sdist = glob.glob("dist/*.tar.gz")[0]
          # Data, not module names: `evolve/evidence/` is code and belongs in the
          # wheel; a run's evidence root does not. Names are archive-relative,
          # so they carry no `serverbench/` prefix.
          banned = ("artifacts/", "third_party", ".venv", "oauth",
                    "server_prototypes", ".pt", ".safetensors",
                    # the verdict, and its host-only correctness stage
                    "final_validate/", "private_correctness")
          names = zipfile.ZipFile(wheel).namelist()
          with tarfile.open(sdist) as tar:
              names += tar.getnames()
          bad = [n for n in names if any(k in n.lower() for k in banned)]
          assert not bad, bad
          import re
          home = re.compile(rb"/(home|Users|root)/[A-Za-z0-9._-]+/")
          z = zipfile.ZipFile(wheel)
          for name in z.namelist():
              if not name.endswith(".py"):
                  continue
              found = home.search(z.read(name))
              assert not found, f"absolute account path in {name}: {found.group()!r}"
          print(f"clean: {wheel}")
          PY

      - name: install into a clean environment outside the repository
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/pip" install --quiet dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/clean/bin/serverbench" evolve --help > /dev/null
          "$RUNNER_TEMP/clean/bin/serverbench" evolve golden
          "$RUNNER_TEMP/clean/bin/python" -c "import serving_evolve as e; print(e.__version__)"

  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: tracked files fit GitHub's push limit
        if: ${{ !cancelled() }}
        run: python3 serverbench/scripts/check_git_blob_sizes.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install
        run: pip install -e './serverbench[dev]'

      - name: skill bundles validate
        if: ${{ !cancelled() }}
        run: serverbench evolve skill serverbench/skills/serving-system-evolution

      - name: live serving-task contracts agree
        if: ${{ !cancelled() }}
        run: python serving_tasks/_manage/taskctl.py check

      - name: documentation links resolve
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY'
          import pathlib, re
          link = re.compile(r"\[[^\]]*\]\(([^)]+)\)")
          missing = []
          roots = [pathlib.Path("serverbench/docs"), pathlib.Path("serverbench/skills"),
                   pathlib.Path("serving_tasks"), pathlib.Path("server_prototypes")]
          for root in roots:
              for doc in root.rglob("*.md"):
                  for target in link.findall(doc.read_text("utf-8", errors="replace")):
                      if target.startswith(("http://", "https://", "#", "mailto:")):
                          continue
                      resolved = (doc.parent / target.split("#")[0]).resolve()
                      if not resolved.exists():
                          missing.append(f"{doc}: {target}")
          assert not missing, missing
          print("every relative documentation link resolves")
          PY

      - name: no credential may be committed
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY'
          import pathlib, re, subprocess
          tracked = subprocess.run(["git", "ls-files"], capture_output=True,
                                   text=True).stdout.split()
          # Shaped like a real credential, not like a placeholder. `sk-ant-your_key`
          # in vendored documentation is not a leak, and a check that cannot tell
          # the difference gets muted, which is worse than not having it.
          secret = re.compile(r"sk-ant-(oat01|api03)-[A-Za-z0-9_-]{24,}"
                              r"|ghp_[A-Za-z0-9]{30,}")
          hits = []
          for path in tracked:
              p = pathlib.Path(path)
              if not p.is_file() or p.stat().st_size > 4_000_000:
                  continue
              try:
                  body = p.read_text("utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              if secret.search(body):
                  hits.append(path)
          assert not hits, hits
          print(f"scanned {len(tracked)} tracked files, no credential pattern")
          PY
